map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream asr_service {
    server asr:8000;
}

upstream qwen_tts_service {
    server qwen-tts:8000;
}

upstream cosyvoice_service {
    server cosyvoice:8000;
}

server {
    listen 18443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    location = /healthz {
        proxy_pass http://asr_service/healthz;
        proxy_set_header Host $host;
    }

    location /asr/v1/realtime {
        proxy_pass http://asr_service;
        include /etc/nginx/conf.d/ws-proxy.inc;
    }

    location /tts/v1/realtime {
        proxy_pass http://qwen_tts_service;
        include /etc/nginx/conf.d/ws-proxy.inc;
    }

    location /tts/cosyvoice {
        proxy_pass http://cosyvoice_service;
        include /etc/nginx/conf.d/ws-proxy.inc;
    }
}
