[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-ws-server"
version = "0.1.0"
description = "Independent WebSocket adapters for ASR and streaming TTS model services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
vad = ["onnxruntime>=1.17.0"]
kotoba = ["torch>=2.2", "transformers>=5.5.3,<6", "accelerate>=0.28"]
qwen3-asr = [
    "qwen-asr==0.0.6",
    "torch>=2.2",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "numpy>=1.26",
]
kokoro = ["kokoro>=0.9.4,<1", "misaki[ja]>=0.9.4,<1"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "numpy>=1.26"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
