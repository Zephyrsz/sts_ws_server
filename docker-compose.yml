name: sts-ws-server

x-model-adapter: &model-adapter
  build: .
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  expose:
    - "8000"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s

services:
  asr:
    <<: *model-adapter
    environment:
      WSS_API_KEY: ${WSS_API_KEY:?set WSS_API_KEY in .env}
      SERVICE_NAME: asr
      ASR_BACKEND: ${ASR_BACKEND:-faster-whisper}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_BASE_URL: ${ASR_BASE_URL:-http://host.docker.internal:8090/v1}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_HTTP_MODEL: ${ASR_HTTP_MODEL:-whisper-1}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-120}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      VAD_RMS_THRESHOLD: ${VAD_RMS_THRESHOLD:-450}
      VAD_FRAME_MS: ${VAD_FRAME_MS:-20}
      VAD_PADDING_MS: ${VAD_PADDING_MS:-120}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
    volumes:
      - asr-model-cache:/models/huggingface

  qwen-tts:
    <<: *model-adapter
    environment:
      WSS_API_KEY: ${WSS_API_KEY:?set WSS_API_KEY in .env}
      SERVICE_NAME: qwen-tts
      QWEN_TTS_BACKEND: ${QWEN_TTS_BACKEND:-openai}
      QWEN_TTS_BASE_URL: ${QWEN_TTS_BASE_URL:-http://host.docker.internal:8091/v1}
      QWEN_TTS_API_KEY: ${QWEN_TTS_API_KEY:-}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      QWEN_TTS_SAMPLE_RATE: ${QWEN_TTS_SAMPLE_RATE:-24000}
      QWEN_TTS_VOICE: ${QWEN_TTS_VOICE:-aiden}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-10000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      TTS_AUDIO_CHUNK_BYTES: ${TTS_AUDIO_CHUNK_BYTES:-4096}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}

  cosyvoice:
    <<: *model-adapter
    environment:
      WSS_API_KEY: ${WSS_API_KEY:?set WSS_API_KEY in .env}
      SERVICE_NAME: cosyvoice
      COSYVOICE_TTS_BACKEND: ${COSYVOICE_TTS_BACKEND:-openai}
      COSYVOICE_TTS_BASE_URL: ${COSYVOICE_TTS_BASE_URL:-http://host.docker.internal:8092/v1}
      COSYVOICE_TTS_API_KEY: ${COSYVOICE_TTS_API_KEY:-}
      COSYVOICE_TTS_MODEL: ${COSYVOICE_TTS_MODEL:-cosyvoice3}
      COSYVOICE_TTS_SAMPLE_RATE: ${COSYVOICE_TTS_SAMPLE_RATE:-24000}
      COSYVOICE_TTS_VOICE: ${COSYVOICE_TTS_VOICE:-default}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-10000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      TTS_AUDIO_CHUNK_BYTES: ${TTS_AUDIO_CHUNK_BYTES:-4096}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      asr:
        condition: service_healthy
      qwen-tts:
        condition: service_healthy
      cosyvoice:
        condition: service_healthy
    ports:
      - "18443:18443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ws-proxy.conf:/etc/nginx/conf.d/ws-proxy.inc:ro
      - ${TLS_DIR:-./tls}:/etc/nginx/tls:ro

volumes:
  asr-model-cache:
