map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name _;

    ssl_certificate /app/sts_ws_server/tls/llm-wss.crt;
    ssl_certificate_key /app/sts_ws_server/tls/llm-wss.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:STS_TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        proxy_pass http://127.0.0.1:8011/healthz;
    }

    location /asr/v1/realtime {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /tts/v1/realtime {
        proxy_pass http://127.0.0.1:18100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /tts/kokoro {
        proxy_pass http://127.0.0.1:18101;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /tts/sarashina {
        proxy_pass http://127.0.0.1:18102;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /ws/v1/chat/completions {
        proxy_pass https://127.0.0.1:18444;
        proxy_ssl_verify off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
